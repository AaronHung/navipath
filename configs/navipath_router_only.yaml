# Ablation A: Router Only (MicroRouter, no ExpertBank, no MacroRouter, no Consolidation)
# 用途：展示只加 routing 機制本身對 CL 的貢獻（剔除 Expert 和 Consolidation 的影響）
# 論文 Ablation Table Row: "NaviPath (Router only)"
device: auto
feat_dim: 512
joint_train_acc: 0.908

num_experts: 4
expert_hidden: 256
beta: 0.3
tau: 1.0
use_experts: false      # ← 關掉 ExpertBank
use_macro: false        # ← 關掉 MacroRouter

ema_decay: 0.7
consolidate_a: 4.0
consolidate_b: 2.0

train_top_k: 128

lr: 0.001
weight_decay: 0.0005
epochs: 12

loss_weights:
  lambda: 0.5
  beta_S: 0.5
  gamma: 0.0            # ← 關掉 L_sem（無 Expert 時語義錨無意義）
  eta: 0.01
  xi: 0.0
  zeta: 1.0             # ← 保留 L_soft_route（router 仍需訓練信號）
  use_consolidation: false  # ← 關掉 Consolidation
