<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang TC','Noto Sans CJK TC',sans-serif">
  <defs>
    <marker id="d-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
    <marker id="d-ah-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15695a"/></marker>
    <marker id="d-ah-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a5bb0"/></marker>
    <marker id="d-ah-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a59f93"/></marker>
    <style>
      .t{font-size:14px;fill:#1b1b1a}
      .b{font-size:14.5px;font-weight:700;fill:#1b1b1a}
      .s{font-size:11px;fill:#5b5b55}
      .lbl{font-size:13.5px;font-weight:700}
      .title{font-size:22px;font-weight:700;fill:#1b1b1a}
      .sub{font-size:13px;fill:#5b5b55}
      .edge{stroke:#444;stroke-width:1.8;fill:none}
      .edge-teal{stroke:#15695a;stroke-width:1.8;fill:none}
      .edge-dash-p{stroke:#7a5bb0;stroke-width:1.4;fill:none;stroke-dasharray:5 4}
      .edge-dash{stroke:#a59f93;stroke-width:1.4;fill:none;stroke-dasharray:6 4}
    </style>
  </defs>
  <rect x="0" y="0" width="1400" height="760" fill="#ffffff"/>

  <text x="700" y="38" text-anchor="middle" class="title">NaviPath-CL - Detailed Technical Framework</text>
  <text x="700" y="60" text-anchor="middle" class="sub">backbone-agnostic Continual Navigation Layer over an abstract backbone interface, instantiated here with QPMIL-VL</text>

  <rect x="56" y="82" width="1090" height="200" rx="14" fill="#f1f8f5" stroke="#15695a" stroke-width="2"/>
  <text x="74" y="108" class="lbl" fill="#15695a">Continual Navigation Layer (CNL) - our contribution (backbone-agnostic)</text>

  <rect x="76" y="124" width="226" height="84" rx="9" fill="#e3f0ec" stroke="#15695a" stroke-width="1.6"/>
  <text x="189" y="150" text-anchor="middle" class="b">Observation State</text>
  <text x="189" y="170" text-anchor="middle" class="s">patch feat + prototype / text sim</text>
  <text x="189" y="186" text-anchor="middle" class="s">+ running evidence summary</text>

  <rect x="332" y="124" width="206" height="84" rx="9" fill="#e3f0ec" stroke="#15695a" stroke-width="1.6"/>
  <text x="435" y="150" text-anchor="middle" class="b">Context Gate</text>
  <text x="435" y="170" text-anchor="middle" class="s">now: oracle (task id)</text>
  <text x="435" y="186" text-anchor="middle" class="s">future: task-query</text>

  <rect x="568" y="124" width="226" height="84" rx="9" fill="#e3f0ec" stroke="#15695a" stroke-width="1.6"/>
  <text x="681" y="150" text-anchor="middle" class="b">Navigation Skill Memory</text>
  <text x="681" y="170" text-anchor="middle" class="s">per-task navigation</text>
  <text x="681" y="186" text-anchor="middle" class="s">skill bank (NSM)</text>

  <rect x="824" y="124" width="302" height="84" rx="9" fill="#e3f0ec" stroke="#15695a" stroke-width="1.6"/>
  <text x="975" y="150" text-anchor="middle" class="b">Budgeted Navigation Policy &#960;</text>
  <text x="975" y="172" text-anchor="middle" class="s">score patches to Top-K</text>
  <text x="975" y="188" text-anchor="middle" class="s">(sequential budgeted observation)</text>

  <line x1="302" y1="166" x2="332" y2="166" class="edge-teal" marker-end="url(#d-ah-teal)"/>
  <line x1="538" y1="166" x2="568" y2="166" class="edge-teal" marker-end="url(#d-ah-teal)"/>
  <line x1="794" y1="166" x2="824" y2="166" class="edge-teal" marker-end="url(#d-ah-teal)"/>

  <rect x="332" y="222" width="206" height="48" rx="8" fill="#ece7f7" stroke="#7a5bb0" stroke-width="1.6"/>
  <text x="435" y="242" text-anchor="middle" class="b" fill="#3f2f63">CL Update</text>
  <text x="435" y="259" text-anchor="middle" class="s">add / freeze / consolidate skill</text>
  <path d="M460,222 C460,214 660,214 681,208" class="edge-dash-p" marker-end="url(#d-ah-purple)"/>
  <path d="M410,222 C410,216 435,214 435,208" class="edge-dash-p" marker-end="url(#d-ah-purple)"/>

  <rect x="56" y="336" width="800" height="118" rx="14" fill="#f5f5f1" stroke="#8a8275" stroke-width="1.8"/>
  <text x="74" y="362" class="lbl" fill="#5b5b55">Backbone Interface (abstract)</text>

  <rect x="76" y="372" width="240" height="62" rx="9" fill="#ffffff" stroke="#8a8275" stroke-width="1.4"/>
  <text x="196" y="400" text-anchor="middle" class="b">encode(WSI) to Z</text>
  <text x="196" y="420" text-anchor="middle" class="s">patch features</text>

  <rect x="336" y="372" width="240" height="62" rx="9" fill="#ffffff" stroke="#8a8275" stroke-width="1.4"/>
  <text x="456" y="400" text-anchor="middle" class="b">predict(subset) to logits</text>
  <text x="456" y="420" text-anchor="middle" class="s">slide-level prediction</text>

  <rect x="596" y="372" width="240" height="62" rx="9" fill="#ffffff" stroke="#8a8275" stroke-width="1.4"/>
  <text x="716" y="400" text-anchor="middle" class="b">task_query(WSI) to q</text>
  <text x="716" y="420" text-anchor="middle" class="s">optional (task-free, future)</text>

  <rect x="900" y="336" width="446" height="118" rx="14" fill="#fafaf7" stroke="#a59f93" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="918" y="362" class="lbl" fill="#8a8275">Future backbones</text>
  <text x="918" y="392" class="t" fill="#5b5b55">replay-based / regularization-based / other MIL / VLM</text>
  <text x="918" y="414" class="s">compatible via the same interface (drop-in)</text>
  <path d="M900,406 C878,406 866,406 856,406" class="edge-dash" marker-end="url(#d-ah-grey)"/>

  <rect x="56" y="508" width="800" height="138" rx="14" fill="#d6e8fb" stroke="#3a78c2" stroke-width="2"/>
  <text x="74" y="534" class="lbl" fill="#1b3a5c">Backbone (this work): QPMIL-VL - prompt/prototype-based diagnostic backbone</text>

  <rect x="76" y="548" width="240" height="78" rx="9" fill="#ffffff" stroke="#3a78c2" stroke-width="1.4"/>
  <text x="196" y="582" text-anchor="middle" class="b">Frozen CONCH encoder</text>
  <text x="196" y="602" text-anchor="middle" class="s">512-d patch features</text>

  <rect x="336" y="548" width="240" height="78" rx="9" fill="#ffffff" stroke="#3a78c2" stroke-width="1.4"/>
  <text x="456" y="576" text-anchor="middle" class="b">Prototype pool +</text>
  <text x="456" y="594" text-anchor="middle" class="b">prototype-guided agg.</text>
  <text x="456" y="613" text-anchor="middle" class="s">prompt/prototype reasoning</text>

  <rect x="596" y="548" width="240" height="78" rx="9" fill="#ffffff" stroke="#3a78c2" stroke-width="1.4"/>
  <text x="716" y="582" text-anchor="middle" class="b">CFE text classifier</text>
  <text x="716" y="602" text-anchor="middle" class="s">stable predictor</text>

  <path d="M456,282 L456,336" class="edge-teal" marker-end="url(#d-ah-teal)"/>
  <text x="468" y="312" class="s" fill="#15695a">Top-K patches (selected observation)</text>

  <path d="M456,454 L456,508" class="edge" marker-end="url(#d-ah)"/>
  <text x="468" y="484" class="s">apply on QPMIL instance</text>

  <path d="M56,560 L30,560 L30,170 L56,170" class="edge" marker-end="url(#d-ah)"/>
  <text x="36" y="360" class="s" transform="rotate(-90 36,360)">Z / logits / q  back to CNL state</text>
</svg>
